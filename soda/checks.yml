## categories table checks
filter staging_layer.categories [weekly]:
  where: inserted_at >= NOW() - INTERVAL '8 days'

checks for staging_layer.categories:
  - row_count > 0
  - missing_count(id) = 0
  - freshness(inserted_at) <= 1d
  - missing_percent(market_cap_change) < 15%
  - min(volume) >= 0
  - min(market_cap) >= 0
  - min(num_tokens) >= 0

checks for staging_layer.categories [weekly]:
  - row_count between 480 and 520
  - missing_count(id) = 0
  - duplicate_count(id) = 0


## category_details table checks

filter staging_layer.category_details [weekly]:
  where: inserted_at >= NOW() - INTERVAL '8 days'

checks for staging_layer.category_details:
  - row_count > 0
  - freshness(inserted_at) <= 9d
  - missing_count(id) = 0
  - missing_count(coins_id) = 0
  - missing_percent(market_cap_change) < 15%
  - min(volume) >= 0
  - min(market_cap) >= 0
  - min(num_tokens) >= 0

checks for staging_layer.category_details [weekly]:
  - row_count between 56500 and 62500
  - missing_count(id) = 0
  - missing_count(coins_id) = 0
  - failed rows:
      name: "id + coins_id + inserted_at should be unique"
      fail query: |
        SELECT id, coins_id, inserted_at, COUNT(*) as cnt
        FROM staging_layer.category_details
        WHERE inserted_at >= NOW() - INTERVAL '8 days'
        GROUP BY id, coins_id, inserted_at
        HAVING COUNT(*) > 1

