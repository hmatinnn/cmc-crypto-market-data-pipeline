## listings_latest table checks (daily accumulation, same-day replacement, ~500 rows/day)

filter staging_layer.listings_latest [daily]:
  where: inserted_at >= CURRENT_DATE

checks for staging_layer.listings_latest:
  - row_count > 0
  - freshness(inserted_at) <= 2d
  - missing_count(id) = 0
  - missing_count(cmc_rank) = 0
  - missing_count(last_updated) = 0
  - missing_count(date_added) = 0
  - missing_count(num_market_pairs) = 0
  - missing_count(circulating_supply) = 0
  - missing_count(total_supply) = 0
  - missing_count(infinite_supply) = 0
  - missing_count(minted_market_cap) = 0
  - missing_count(inserted_at) = 0
  - missing_percent(max_supply) < 50%
  - missing_percent(tvl_ratio) < 96%
  - missing_percent(self_reported_circulating_supply) < 45%
  - missing_percent(self_reported_market_cap) < 45%

checks for staging_layer.listings_latest [daily]:
  - row_count between 480 and 520
  - missing_count(id) = 0
  - missing_count(cmc_rank) = 0
  - failed rows:
      name: "id + inserted_at should be unique"
      fail query: |
        SELECT id, DATE(inserted_at) AS day, COUNT(*) AS cnt
        FROM staging_layer.listings_latest
        WHERE inserted_at >= CURRENT_DATE
        GROUP BY id, DATE(inserted_at)
        HAVING COUNT(*) > 1

