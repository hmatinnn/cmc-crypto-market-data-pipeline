name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# Cancels older runs when new commits are pushed to the same branch (saves minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # 1. LINT - Python code quality
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.16.1

      - name: Ruff check (blocking)
        run: ruff check --output-format=github dags jobs pytest

      - name: Ruff format diff (informational only)
        continue-on-error: true
        run: ruff format --diff dags jobs pytest

      # The project is developed on Windows but runs on Linux/Docker.
      # A shell script committed with CRLF endings fails on the server with
      # "/usr/bin/env: 'bash\r': No such file or directory", so we block it here.
      - name: No CRLF line endings in tracked files
        run: |
          bad=$(git ls-files -z -- '*.sh' '*.py' '*.sql' '*.yml' '*.yaml' 'Dockerfile*' \
                | xargs -0 -r grep -lU $'\r' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files have CRLF line endings and will break on Linux:"
            echo "$bad"
            echo "Fix: git add --renormalize . && git commit -m 'chore: normalize line endings'"
            exit 1
          fi
          echo "All tracked files use LF - OK"

      # Shell scripts must keep the executable bit in the git index.
      # Windows cannot represent it, so it is easy to lose.
      - name: Shell scripts must be executable
        run: |
          fail=0
          while IFS= read -r f; do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::$f is not executable in git (mode $mode)."
              echo "Fix: git update-index --chmod=+x $f"
              fail=1
            fi
          done < <(git ls-files -- '*.sh')
          [ "$fail" -eq 0 ] && echo "All shell scripts are executable - OK"
          exit $fail

  # ---------------------------------------------------------------------------
  # 2. UNIT TESTS
  # ---------------------------------------------------------------------------
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          CMC_API_KEY: dummy-key-for-tests
        run: pytest pytest --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. DBT - parse and compile all SQL models
  # ---------------------------------------------------------------------------
  dbt:
    name: dbt parse & compile
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: dwh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U airflow -d dwh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_USER: airflow
      DBT_PASSWORD: airflow
      DBT_DATABASE: dwh
      DBT_SCHEMA: staging_layer
      DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install dbt-postgres

      - name: Prepare CI profile
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cp dbt/cmc_pipeline/profiles.ci.yml "$DBT_PROFILES_DIR/profiles.yml"

      - name: Create source schema
        run: |
          PGPASSWORD=airflow psql -h localhost -U airflow -d dwh \
            -c "CREATE SCHEMA IF NOT EXISTS staging_layer;"

      - name: dbt deps
        working-directory: dbt/cmc_pipeline
        run: |
          if [ -f packages.yml ]; then dbt deps; else echo "no packages.yml - skipping"; fi

      - name: dbt debug
        working-directory: dbt/cmc_pipeline
        run: dbt debug

      - name: dbt parse (build manifest)
        working-directory: dbt/cmc_pipeline
        run: dbt parse

      - name: dbt compile (render SQL)
        working-directory: dbt/cmc_pipeline
        run: dbt compile

  # ---------------------------------------------------------------------------
  # 4. DOCKER BUILD + AIRFLOW DAG IMPORT CHECK
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build & DAG import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: coinmarket-airflow:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build dbt image
        uses: docker/build-push-action@v6
        with:
          context: ./dbt
          file: ./dbt/Dockerfile
          tags: coinmarket-dbt:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build soda image
        uses: docker/build-push-action@v6
        with:
          context: ./soda
          file: ./soda/Dockerfile
          tags: coinmarket-soda:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # DAGs are parsed inside the real airflow image, so syntax errors or
      # broken imports are caught here.
      - name: Airflow DAG import check
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/dags:/opt/airflow/dags:ro" \
            -v "${{ github.workspace }}/jobs:/opt/airflow/jobs:ro" \
            -v "${{ github.workspace }}/ci:/opt/ci:ro" \
            -e AIRFLOW_HOME=/opt/airflow \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -e AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags \
            -e PYTHONPATH=/opt/airflow/jobs \
            coinmarket-airflow:ci \
            python /opt/ci/check_dags.py

  # ---------------------------------------------------------------------------
  # 5. SECURITY - check for leaked secrets
  # ---------------------------------------------------------------------------
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the full history

      - name: .env must not be tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git! Remove it with 'git rm --cached .env'."
            exit 1
          fi
          echo ".env is not tracked - OK"

      - name: Gitleaks scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner -v

  # ---------------------------------------------------------------------------
  # 6. FINAL GATE - branch protection points at this single job
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, test, dbt, docker, security]
    if: always()
    steps:
      - name: Did every job succeed?
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One of the CI jobs failed."
            exit 1
          fi
          echo "All CI checks passed."
