name: CD (deploy to server)

# CD does not poll for CI: GitHub can trigger a workflow when another one
# finishes. "workflow_run" fires once the CI workflow completes on main, and the
# job below only proceeds when its conclusion was success.
#
# This replaces an earlier wait-on-check-action step, which needed a "checks:
# read" token permission and installed a Ruby toolchain on every run.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag to deploy (default: main)"
        required: false
        default: main

concurrency:
  group: cd-production
  cancel-in-progress: false  # deploys must not interrupt each other

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    # Manual runs always proceed; automatic runs only after a green CI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    # Create a "production" environment under Settings -> Environments and add
    # "Required reviewers" if every deploy should wait for manual approval.
    environment:
      name: production

    env:
      DEPLOY_REF: ${{ github.event.inputs.ref || 'main' }}

    steps:
      - name: Show what triggered this deploy
        run: |
          echo "event      : ${{ github.event_name }}"
          echo "deploy ref : $DEPLOY_REF"
          echo "CI result  : ${{ github.event.workflow_run.conclusion || 'n/a (manual run)' }}"
          echo "commit     : ${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Verify required secrets exist
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=""
          if [ -z "$SSH_HOST" ]; then missing="$missing SSH_HOST"; fi
          if [ -z "$SSH_USER" ]; then missing="$missing SSH_USER"; fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then missing="$missing SSH_PRIVATE_KEY"; fi
          if [ -z "$DEPLOY_PATH" ]; then missing="$missing DEPLOY_PATH"; fi
          if [ -n "$missing" ]; then
            echo "::error::These GitHub Secrets are not configured:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Run deploy script on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            REF="${{ github.event.inputs.ref || 'main' }}"

            # Update the checkout HERE, before deploy.sh is read by bash. The
            # script used to do this itself, which meant any change to it only
            # took effect on the following deploy - the running shell had
            # already read the old file.
            echo "Updating checkout to origin/$REF ..."
            git fetch --prune origin
            git checkout "$REF"
            git reset --hard "origin/$REF"
            echo "Now at: $(git rev-parse --short HEAD) $(git log -1 --pretty=%s)"

            # Invoked as "bash deploy/deploy.sh" rather than "./deploy/deploy.sh"
            # on purpose: Windows cannot store the executable bit, so the file may
            # arrive on the server with mode 644 and "./" would fail.
            bash deploy/deploy.sh

      - name: Deploy result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deploy succeeded: $DEPLOY_REF"
          else
            echo "::error::Deploy failed - check the server with 'docker compose ps'."
          fi
